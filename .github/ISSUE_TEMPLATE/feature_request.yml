name: Feature Request
description: Suggest a new feature, model provider, or optimization for OmliteRoute
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OmliteRoute! Please describe the use case, provider, or optimization you would like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: "What workflow or problem does this feature solve?"
      placeholder: "I want to route requests to ... or optimize RAM when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "How should this feature work in OmliteRoute?"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Any workaround or alternative solutions you considered?"
    validations:
      required: false
