name: Bug Report
description: Report a bug or unexpected behavior in OmliteRoute
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and patch it promptly.
        **Note:** Please do **NOT** share sensitive credentials, raw SQLite databases, or API keys in your report.

  - type: input
    id: version
    attributes:
      label: OmliteRoute Version
      description: "Run `omliteroute --version` or check the sidebar badge in the dashboard."
      placeholder: "e.g. 1.0.3"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - npm / npx (global)
        - Standalone 1-line script (curl -fsSL https://raw.githubusercontent.com/adamhasani/omliteroute/main/install.sh | bash)
        - Docker Alpine (docker-compose.lite.yml)
        - Cloned from source
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian/Arch/Alpine)
        - macOS
        - Windows (WSL2 / PowerShell)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: "Run `node -v`."
      placeholder: "e.g. v22.14.0"
    validations:
      required: false

  - type: input
    id: client-tool
    attributes:
      label: Client Tool / AI Agent
      description: "Which tool or client are you connecting through OmliteRoute?"
      placeholder: "e.g. Claude Code, Cursor, Roo Code, Gemini CLI, cURL, Hermes Agent"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Clear and concise explanation of what the bug is."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: "Step-by-step reproduction instructions."
      placeholder: |
        1. Start OmliteRoute via `omliteroute`
        2. Navigate to '...' or call API '...'
        3. Encounter error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Output
      description: "Paste relevant sanitized terminal logs or output (run `omliteroute doctor` if available)."
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "If applicable, drag and drop visual evidence here."
    validations:
      required: false
